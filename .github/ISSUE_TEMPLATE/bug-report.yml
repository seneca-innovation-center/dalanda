name: Bug report
description: Something is wrong in this repository or on dalanda.ai (a dead registry link, a docs error, a CI failure).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: For security problems, do not use this form. Follow SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: The page or file, the commands you ran, or a link to the CI run.
    validations:
      required: true
