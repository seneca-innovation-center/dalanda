# Brings the sources accepted on dalanda.ai into registry/sources.yaml, through a pull request.
#
#   sync            The admin Sync button (workflow_dispatch, started by the dalanda-backend GitHub App) and a weekly
#                   fallback. Reads the accepted sources the registry does not have yet from the backend, adds them
#                   to sources.yaml, renders sources.md, checks the result and opens (or updates) one PR.
#   mark-synced     Runs when that PR is merged. Tells the backend which sources are now in the registry, so it stops
#                   exporting them and locks them on the admin page. From then on, a change to an entry is a PR here.
#   notify-slack    Posts to Slack when either job fails. A run with nothing new is normal, so it does not alert.
#
# Needs (Settings > Secrets and variables > Actions):
#   vars.REGISTRY_API_URL                 Base URL of dalanda-backend, for example https://api.dalanda.ai
#   vars.REGISTRY_SYNC_APP_CLIENT_ID      Client id of the GitHub App installed on this repository
#   secrets.REGISTRY_SYNC_APP_PRIVATE_KEY Its private key (PEM)
#   secrets.REGISTRY_READ_KEY             = REGISTRY_READ_KEY of the backend (read the export)
#   secrets.REGISTRY_WRITE_KEY            = REGISTRY_WRITE_KEY of the backend (mark sources synced)
#   secrets.SLACK_WEBHOOK_URL             Incoming webhook of the team's CI channel
# And the labels `automated` and `data` on this repository.
name: Sync registry

on:
  schedule:
    - cron: "0 6 * * 1" # weekly fallback
  workflow_dispatch: # the Sync button on dalanda.ai starts this
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.12"
  SYNC_BRANCH: chore/registry-sync

jobs:
  sync:
    name: sync
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One run at a time: a second click waits for the first, so two runs cannot open two PRs.
    concurrency:
      group: sync-registry
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Fetch the accepted sources
        env:
          REGISTRY_API_URL: ${{ vars.REGISTRY_API_URL }}
          REGISTRY_READ_KEY: ${{ secrets.REGISTRY_READ_KEY }}
        run: |
          : "${REGISTRY_API_URL:?Set the REGISTRY_API_URL repository variable}"
          : "${REGISTRY_READ_KEY:?Set the REGISTRY_READ_KEY secret}"
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-all-errors \
            --header "Authorization: Bearer ${REGISTRY_READ_KEY}" \
            --output "${RUNNER_TEMP}/export.json" \
            "${REGISTRY_API_URL%/}/api/registry/sources"
      # The export lists every accepted source not yet marked synced, including the ones an open sync PR already
      # holds: this job starts from main each time, so the PR is rewritten from the export (an edit or a reject on
      # dalanda.ai shows up on the next Sync). A source already in sources.yaml is skipped. Entries are appended as
      # text, so the file's comments and the existing entries are left exactly as they are.
      - name: Add them to sources.yaml
        run: |
          uv run python - <<'PY'
          import json
          import os
          import re
          import textwrap
          from datetime import date
          from pathlib import Path

          import yaml

          temp = Path(os.environ["RUNNER_TEMP"])
          path = Path("registry/sources.yaml")
          ORDER = [
              "id", "name", "url", "link_withheld", "type", "domains", "writing", "description",
              "licence", "licence_url", "provenance", "added", "credit",
          ]

          exported = json.loads((temp / "export.json").read_text(encoding="utf-8"))["sources"]
          text = path.read_text(encoding="utf-8")
          have = {entry["id"] for entry in (yaml.safe_load(text) or {}).get("sources") or []}

          added = []
          for source in exported:
              unknown = sorted(set(source) - set(ORDER))
              if unknown:
                  raise SystemExit(f"error: the export has fields the registry does not know: {unknown}")
              if source["id"] in have:
                  continue
              entry = {key: source[key] for key in ORDER if source.get(key) not in (None, [], "")}
              entry["added"] = date.fromisoformat(entry["added"])  # a date, not a string or a timestamp
              added.append(entry)

          if added:
              if not text.endswith("\n"):
                  text += "\n"
              text = re.sub(r"^sources:[ \t]*\[\][ \t]*$", "sources:", text, flags=re.MULTILINE)
              # Short lists in flow style, as in docs/registry.md (`domains: [forum]`): yamllint --strict accepts it.
              block = yaml.safe_dump(
                  added, sort_keys=False, allow_unicode=True, width=10_000, default_flow_style=None
              )
              path.write_text(text + textwrap.indent(block, "  "), encoding="utf-8")

          lines = [
              f"Adds {len(added)} source{'' if len(added) == 1 else 's'} accepted on dalanda.ai.",
              "",
              *[f"- {entry['name']} (`{entry['id']}`)" for entry in added],
              "",
              "Merging this PR marks them as in the registry on dalanda.ai, which then locks them.",
              "A change to an entry after that is a pull request here, not an edit on the admin page.",
          ]
          (temp / "pr_body.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"{len(added)} new, {len(have)} already in the registry, {len(exported)} exported")
          PY
      - name: Registry checks
        run: |
          uv run dalanda-registry check
          uv run dalanda-registry render
      # The org does not let GITHUB_TOKEN open pull requests, and a PR it opens would not start CI. The GitHub
      # App's token does both, limited to this repository and these two permissions.
      - name: Mint a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.REGISTRY_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # One fixed branch: an open sync PR is updated, never duplicated. With nothing to add, no PR is opened (and
      # an open one with nothing left to add is closed).
      - name: Open or update the PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: sync registry from dalanda.ai"
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: true
          title: "chore: sync registry from dalanda.ai"
          body-path: ${{ runner.temp }}/pr_body.md
          add-paths: |
            registry/sources.yaml
            registry/sources.md
          labels: |
            automated
            data

  mark-synced:
    name: mark synced
    # Only the sync PR, from this repository, and only when it was merged (not just closed).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'chore/registry-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own group: a mark must never be dropped for a queued Sync run, and it is safe to run twice.
    concurrency:
      group: sync-registry-mark
      cancel-in-progress: false
    steps:
      # The merged commit and its parent: the ids that are new in the merge are the ones this PR brought in.
      - name: Check out the merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked
      - name: Tell dalanda.ai these sources are in the registry
        env:
          REGISTRY_API_URL: ${{ vars.REGISTRY_API_URL }}
          REGISTRY_WRITE_KEY: ${{ secrets.REGISTRY_WRITE_KEY }}
        run: |
          : "${REGISTRY_API_URL:?Set the REGISTRY_API_URL repository variable}"
          : "${REGISTRY_WRITE_KEY:?Set the REGISTRY_WRITE_KEY secret}"
          git show HEAD^:registry/sources.yaml > "${RUNNER_TEMP}/before.yaml"
          uv run python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          import yaml

          MAX_IDS = 500  # the most one call takes; the backend exports at most this many at a time


          def ids(text: str) -> list[str]:
              return [entry["id"] for entry in (yaml.safe_load(text) or {}).get("sources") or []]


          before = set(ids((Path(os.environ["RUNNER_TEMP"]) / "before.yaml").read_text(encoding="utf-8")))
          new = [i for i in ids(Path("registry/sources.yaml").read_text(encoding="utf-8")) if i not in before]
          if not new:
              print("No new source in this merge: nothing to mark.")
              raise SystemExit(0)
          url = os.environ["REGISTRY_API_URL"].rstrip("/") + "/api/registry/synced"
          marked = 0
          for start in range(0, len(new), MAX_IDS):
              body = json.dumps({"ids": new[start : start + MAX_IDS]}).encode()
              request = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {os.environ['REGISTRY_WRITE_KEY']}",
                      "Content-Type": "application/json",
                  },
              )
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          marked += json.load(response)["synced"]
                      break
                  except (urllib.error.URLError, TimeoutError) as error:
                      if attempt == 3:
                          raise SystemExit(f"error: could not mark the sources as synced: {error}") from error
                      time.sleep(5 * attempt)
          print(f"{len(new)} sources in the merge, {marked} newly marked (already marked ones count once)")
          PY

  notify-slack:
    name: notify Slack
    needs: [sync, mark-synced]
    if: always() && (needs.sync.result == 'failure' || needs.mark-synced.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNC_RESULT: ${{ needs.sync.result }}
          MARK_RESULT: ${{ needs.mark-synced.result }}
        run: |
          : "${SLACK_WEBHOOK_URL:?Set the SLACK_WEBHOOK_URL secret}"
          what="Marking the merged sources as synced failed"
          if [ "$SYNC_RESULT" = failure ]; then what="The registry sync failed"; fi
          jq -n --arg text "${what}: ${RUN_URL}" '{text: $text}' |
            curl --fail --silent --show-error --max-time 30 --header "Content-Type: application/json" \
              --data @- "$SLACK_WEBHOOK_URL"
