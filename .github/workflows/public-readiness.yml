# Runs the org-wide "Open Source Readiness" checks against this repository.
# Manual only: Actions → Public Readiness → Run workflow.

name: Public Readiness

on:
  workflow_dispatch:

permissions: {}

jobs:
  readiness:
    # yamllint disable-line rule:line-length
    uses: seneca-innovation-center/.github/.github/workflows/PUBLIC_READINESS.yml@8de08e0b0a65955455907d65598e0cd40c0a41ef # main
    permissions:
      contents: read
      issues: read
      actions: read
      checks: read
      pull-requests: read
      security-events: write # only used when run-codeql + upload-sarif are on
    with:
      # zizmor's online audits cannot read the private seneca-innovation-center/.github
      # repository with this run's token, so Super-Linter skips this one file. The
      # repository's own CI still runs yamllint and zizmor (offline) on it.
      lint-exclude-regex: "\\.github/workflows/public-readiness\\.yml$"
    secrets:
      # Optional fine-grained read-only PAT; without it some settings checks
      # report "could not verify".
      ADMIN_TOKEN: ${{ secrets.OSS_READINESS_ADMIN_TOKEN }}
